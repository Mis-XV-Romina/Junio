<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitación XV Zoe Antonella</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="pantalla">
      <div class="invitacion">
        <div class="contenido">
          <button
            class="play-btn"
            onclick="alert('Aquí puedes poner música o animación')"
          >
            ▶
          </button>
        </div>
        <img src="imagenes/fondo1.png" alt="Invitación XV" class="fondo" />
      </div>
    </section>

    <section class="pantalla">
      <div class="invitacion">
        <div class="contenido">
          <a
            href="https://maps.google.com"
            target="_blank"
            class="location-btn"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="23"
              viewBox="0 0 24 24"
              width="23"
              fill="white"
            >
              <path
                d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"
              />
            </svg>
            UBICACIÓN FIESTA
          </a>
          <a
            href="https://maps.google.com"
            target="_blank"
            class="location-btn2"
          >
            <img src="iconos/circle-check-regular.svg" alt="check-icon" style="width: 23px; height: 23px; filter: invert(100%) brightness(1000%) !important;">
            CONFIRMAR
          </a>
        </div>
        <img src="imagenes/fondo2.png" alt="Invitación XV" class="fondo" />
      </div>
    </section>
  </body>
</html>
